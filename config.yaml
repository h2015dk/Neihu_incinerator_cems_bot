# 複製成 config.yaml 再填寫。用 GitHub 執行時，金鑰欄位留空、改放 Repository secrets。
#標【待核】的數值請以實際資料取代。

moenv_api_key: ""
cwa_api_key: ""            # 選填：中央氣象署開放資料授權碼（wind.source 設 cwa/auto 才用）
cems_dataset: aqx_p_186    # aqx_p_187＝1 小時紀錄值｜aqx_p_186＝15 分鐘紀錄值（更新較快）｜aqx_p_185＝6 分鐘紀錄值

facilities:                # 可監控多座廠；不需要的整段刪掉即可
 
  - id: neihu
    name: 內湖焚化廠
    cno: "A4200130"                # 管制編號
    abbr_keywords: ["內湖"]   # 若比對到其他「內湖」業者，請改填 cno
    epb_county: "臺北市"
    stack_lat: 25.06303903157262   # 使用者提供
    stack_lon: 121.60339989709442
    stack_height_m: 74    # https://www.nhrip.gov.taipei/News_Content.aspx?n=4B131BBA3EBF5BA4&sms=27C2FD56F62BA6DC&s=B77DCE6AAC1D3021
    stack_diameter_m: 1.25  # 許可證
    default_exit_temp_c: 165.8666667  # 使用者提供2025年均值
    default_flow_nm3_per_hr: 38968.2  # 使用者提供2025年均值
    default_exit_velocity_m_s: 13.77 # 使用者提供2025年均值（無 CEMS 流率時直接採用）
    force_flow_nm3_per_hr: 38968.2   # force／force-group 測試用流率（與預設流率相同，可省略）
    wind_station: ""                 # 留空才會做多站合成
    forecast_town: 內湖區   # 風向預報取用的行政區

receptors:                 # 敏感點：一定畫進擴散圖，並在 LINE 訊息列出估算濃度
  - name: 環興公司
    lat: 25.06218106073602
    lon: 121.59389274357389
  - name: 松山國小
    lat: 25.05047633780741
    lon: 121.5782962560989

notify:                          # 通報規則
  window_start: "07:00"          # 只在此時段發送（臺灣時間）；時段外的通知延到下一個時段
  window_end: "20:00"            # cron 設每小時第 20 分時，20:20 那次不會發；要包含就改 "20:30"
  event_codes: ["B", "C"]        # 視為「起爐」的運轉狀態碼
  notify_shutdown: true          # 停爐也通報（首則＋下風警告）
  shutdown_codes: ["D", "E"]     # 視為「停爐」的運轉狀態碼
  shutdown_end_notice: false     # 停爐結束不發通知
  notify_fault: true             # 防制設備異常（正常運轉中）也通報
  fault_codes: ["A"]             # 視為「防制設備異常」的運轉狀態碼
  fault_end_notice: true         # 防制設備恢復正常時發通知
  fault_with_op_codes: ["B", "D"]  # 起爐／停爐訊息中加註「防制設備同時異常」的狀態碼
  primary_receptor: 環興公司     # 依此判斷是否加發下風警告
  extra_receptors: [松山國小]    # 補充資訊，只列出、不觸發警告
  downwind_half_angle_deg: 22.5  # 敏感點方位在煙流方向 ±此角度內 → 判定為下風【可調】
  downwind_max_km: 10            # 超過此距離不判為下風
  forecast_hours: 12             # 往後看幾小時的風向預報
  attach_map: true               # 起爐首則與下風警告附擴散圖
  heartbeat: true                # 每天第一次進入發送時段時，發一則「機器人運作正常」

forecast:                        # 中央氣象署鄉鎮預報（需 cwa_api_key；沒有就不顯示預報句）
  enabled: true
  dataset: F-D0047-061           # 臺北市逐 3 小時預報

alert:
  startup_codes: ["B", "C"]     # 起火（爐）
  shutdown_codes: ["D", "E"]    # 停車（爐）
  control_fault_codes: ["A"]    # 正常運轉但防制設施異常（與戴奧辛相關，建議保留）
  co_warn_ppm: null             # 自訂 CO 預警門檻（低於法規標準的提早警示），不用就 null
  max_data_age_hours: 3

dioxin:                          # CEMS 不量戴奧辛，以下為假設排放濃度（ng I-TEQ/Nm³）
  startup_conc_ng_iteq_nm3: 10     # 起爐：依使用者指定
  shutdown_conc_ng_iteq_nm3: 10    # 停爐【待核：暫沿用起爐值】
  fault_conc_ng_iteq_nm3: 1        # 正常運轉但防制設備異常：依使用者指定
  normal_conc_ng_iteq_nm3: 0.1     # 正常運轉：依使用者指定（目前通報流程不模擬正常運轉）
  run_on_co_exceed: true         # 只有 CO 超標（非起停爐）時是否也跑擴散

dispersion:
  grid_half_width_km: 15        # 會自動擴大到涵蓋所有敏感點
  grid_step_m: 100
  anemometer_height_m: 35        # 測站風速計高度【待核】
  night_cloudy: false            # 夜間雲量未知；false=晴空（較穩定）
  min_wind_m_s: 0.5
  contour_levels_fg_teq_m3: [1, 10, 50, 100, 500, 1000]   # fg I-TEQ/m³

aermod:                          # EPA AERMOD（需先執行 aermod-setup 編譯執行檔；失敗時自動改用高斯模式）
  enabled: true
  met: aermet                    # aermet＝先用 AERMET，失敗改 Python 計算｜python＝只用 Python 計算
  urban_population: 2600000      # 都市選項人口數（臺北市）【待核】
  wind_height_m: 10              # 實測風速的代表高度（氣象署自動站約 10 m）【待核】
  grid_half_width_km: 8          # 計算範圍（會自動擴大到涵蓋敏感點）
  grid_step_m: 100
  site_char: {albedo: 0.18, bowen: 1.5, z0: 1.0}   # 地表特性（都市典型值）【待核】

terrain:                         # 地形（AWS Terrain Tiles，免金鑰，下載一次後快取）
  enabled: true
  zoom: 12                       # 圖磚層級；12 約 34 m 解析度
  # f_horizontal: {A: 0.5, B: 0.5, C: 0.5, D: 0.5, E: 0.6, F: 0.7}  # 各穩定度的「水平撞山」權重，可自訂

map:
  basemap: osm                   # osm（中文地名）| carto_light（淡色、英文地名）| none
  basemap_fade: 0.25             # 底圖調淡比例 0~1
  fill_alpha: 0.6                # 濃度色塊不透明度
  top_color: "#3f007d"           # 最高濃度級距顏色（深紫）
  # color_stops: ["#ffffb2", "#fecc5c", "#fd8d3c", "#e31a1c", "#99004c"]  # 其餘級距的漸層，可自訂
  center: 環興公司               # 位於圖框正中央的敏感點（名稱須與 receptors 相同）
  anchor:                        # 另一敏感點在圖框中的位置：x、y 各為圖寬、圖高的比例（由左下角起算）
    name: 松山國小
    x_frac: 0.10
    y_frac: 0.10
  # center 或 anchor 留空 → 改為依煙囪、敏感點、濃度範圍自動決定圖框
  terrain_contours: true         # 地圖疊加地形等高線
  terrain_contour_step_m: 50     # 等高線間距
  include_wind_stations: true    # 風向測站一定畫進圖內；在框外時以中心點等比例放大圖框
                                 # （放大後 anchor 敏感點不再固定在 10%／10%，會往內移）

wind:
  source: auto                   # moenv | cwa | auto（auto=兩者一起比較；沒有 CWA_API_KEY 時只用環境部）
  fixed_station: ""              # 全部廠共用的指定測站；各廠 wind_station 優先（有指定就不合成）
  n_nearest: 3                   # 取最近幾站合成風向；1＝只用最近一站
  weighting: idw                 # idw＝反距離平方加權（近的站權重大）｜equal＝等權重
  max_km: 15                     # 只採用此距離內的測站
  low_consistency: 0.5           # 各站風向一致性低於此值時，訊息加註「可信度較低」

line:
  channel_access_token: "LINE Messaging API 的 Channel access token（long-lived）"
  to: "通報對象：群組 groupId（C 開頭）或個人 userId（U 開頭）"
  admin_to: ""                   # 管理者個人 userId；每日運作確認與 force 測試只發這裡（省群組則數）

image_host:                      # LINE 圖片訊息只能用公開 HTTPS 網址
  type: github                   # none | imgur | static | github（github 僅限 public repo）
  github_branch: plume-images
  imgur_client_id: ""
  static_dir: ""                 # 例如 /var/www/html/plume
  static_base_url: ""            # 例如 https://your-server/plume

state_file: state.json
